name: Core platform smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      JOBBOT_PRIVATE_DIR: ${{ runner.temp }}/sharkapoolu-platform-private
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core and PDF extra
        run: python -m pip install -e ".[resume]"
      - name: Initialize and check blank private templates
        run: |
          python -m job_bot.private_config init
          python -m job_bot.private_config check
          python -m job_bot.easy_cli check
      - name: Test intake, manual database and material/template contracts
        run: python -m unittest cv.test_resume_import job_bot.test_manual_database cv.bot.test_bot application_bot.test_manual_kit
      - name: Exercise native PowerShell bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\bootstrap.ps1 -WithResume
      # Real accounts, portal submission, TeX rendering and SSH RPC are not smoke-tested here.
